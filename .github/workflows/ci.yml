name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff
      - name: Check that the root module and the wrappers have the same interface
        run: ./scripts/check-sync.sh

  test:
    name: Validate and test (${{ matrix.dir }}, terraform ${{ matrix.terraform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - .
          - modules/dns/records
          - modules/dns/v4
          - modules/dns/v5
          - examples/v4
          - examples/v5
          - examples/yaml
          - examples/import
        # Minimum supported and the latest version
        terraform: [1.8.5, latest]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: terraform init -backend=false
      - run: terraform validate
      - run: terraform test

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      TERRAFORM_DOCS_VERSION: v0.24.0
      TERRAFORM_DOCS_SHA256: 9005daf969de0b50134493a2c00078b49f5f5b39d021cda7c89bf4d4f3d776d3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install terraform-docs
        run: |
          curl -fsSLo terraform-docs.tar.gz "https://github.com/terraform-docs/terraform-docs/releases/download/${TERRAFORM_DOCS_VERSION}/terraform-docs-${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz"
          echo "${TERRAFORM_DOCS_SHA256}  terraform-docs.tar.gz" | sha256sum --check
          sudo tar -xzf terraform-docs.tar.gz -C /usr/local/bin terraform-docs
          rm terraform-docs.tar.gz
      - run: ./scripts/generate-docs.sh
      - name: Check that module READMEs are up to date
        run: git diff --exit-code || { echo "Module READMEs are outdated, run ./scripts/generate-docs.sh"; exit 1; }

  provider-min:
    name: Minimum provider (${{ matrix.dir }}, cloudflare ${{ matrix.provider }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: modules/dns/v4, provider: 4.41.0 }
          - { dir: modules/dns/v5, provider: 5.26.0 }
          - { dir: ., provider: 5.26.0 }
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      # The mocked provider uses the schema of this version, so tests catch attributes it lacks
      - name: Pin the provider to the minimum supported version
        run: |
          cat >provider_override.tf <<EOF
          terraform {
            required_providers {
              cloudflare = {
                source  = "cloudflare/cloudflare"
                version = "= ${{ matrix.provider }}"
              }
            }
          }
          EOF
      - run: terraform init -backend=false
      - run: terraform validate
      - run: terraform test

  e2e-config:
    name: Validate end-to-end configurations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: Validate
        run: |
          for dir in tests/e2e/v5 tests/e2e/import tests/e2e/v4 tests/e2e/v4to5; do
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate
          done
      - run: shellcheck tests/e2e/*.sh scripts/*.sh

  schema:
    name: JSON Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: pip install --quiet jsonschema pyyaml
      - run: python3 scripts/generate-schema.py
      - name: Check that the schema is up to date
        run: git diff --exit-code schema/ || { echo "The schema is outdated, run scripts/generate-schema.py"; exit 1; }
      # The same documents through the module: the schema and the validation must agree
      - run: python3 scripts/test-schema.py --terraform examples/yaml/records.easy-dns.yaml

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    # The gitleaks CLI; the gitleaks action needs a license for organizations
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          sudo tar -xzf "${archive}" -C /usr/local/bin gitleaks
      - name: Scan the git history
        run: gitleaks git --redact --no-banner --verbose .

  # The one check for branch rules: the job list and the matrix can change
  # without updating the required checks
  ci-passed:
    name: CI passed
    if: always()
    needs: [fmt, test, docs, provider-min, e2e-config, schema, tflint, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - name: Check that all jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "Not all jobs passed: $RESULTS"; exit 1; }
          done
